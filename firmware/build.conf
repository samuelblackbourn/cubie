# Build-time configuration for Cubie's firmware.
#
# Versioned on purpose. Everything here was, until now, either typed at a
# prompt or living in one machine's working tree -- which meant the font fix
# and the OTA endpoint were one `rm -rf ~/stackchan-mcp` from gone.
#
# Override any of it in the environment; these are defaults, not commandments.

# --- upstream sources, pinned ------------------------------------------------
# Both pins are exact commits, not branches. A build that floats on someone
# else's default branch is not reproducible, and "it worked last week" is not
# a bisectable claim.
STACKCHAN_REPO="${STACKCHAN_REPO:-https://github.com/kisaragi-mochi/stackchan-mcp.git}"
STACKCHAN_PIN="${STACKCHAN_PIN:-558cf404dcd215993d5af9a4495fd34339b6c314}"

# M5's avatar, vendored rather than submoduled -- see m5avatar/VENDORED.md for
# why. This pin must match the Commit row in that file.
M5_REPO="${M5_REPO:-https://github.com/m5stack/StackChan}"
M5_PIN="${M5_PIN:-1b5765599fba8aaad1811d9a79358ccc7051f5f3}"

# --- where the office lives, as the ROBOT sees it ----------------------------
# Baked into the image as CONFIG_OTA_URL, so whatever is here is what the robot
# will look for after it is no longer on a cable.
#
# A NAME rather than an address, deliberately. `192.168.0.84` was a DHCP lease:
# it works until the router hands office-server a different one, and then OTA
# stops with no symptom on the device and nothing to notice until an update
# silently never arrives. A name survives that.
#
# What it costs: a resolution step that can fail where an address cannot. The
# `.local` suffix is mDNS, which needs
# CONFIG_LWIP_DNS_SUPPORT_MDNS_QUERIES -- set explicitly in build.sh rather
# than left to the pinned IDF's default, because a default is not a decision.
#
# What it does NOT cost, which is worth being clear about: this URL is the
# UPDATE path only. If the name stops resolving he keeps running exactly as he
# is and simply stops taking over-the-air updates until the cable comes out --
# the same cable he was first flashed with. It is a lost convenience, not a
# dead robot.
#
# The escape hatch is one variable, so an address is always still available:
#   OFFICE_HOST=192.168.0.84 bash ~/cubie/firmware/build.sh
OFFICE_HOST="${OFFICE_HOST:-office-server.local}"
OFFICE_PORT="${OFFICE_PORT:-8420}"

# --- language ---------------------------------------------------------------
# The firmware defaults to LANGUAGE_ZH_CN, so every on-screen string and every
# locale sound asset (welcome, activation, wificonfig, the spoken digits) is
# Chinese. That is what makes the boot screen unreadable and the startup voice
# unintelligible.
#
# This selects a Kconfig `choice`, so it must name the option exactly:
# LANGUAGE_EN_US, LANGUAGE_JA_JP, LANGUAGE_DE_DE and so on -- see
# firmware/main/Kconfig.projbuild for the full list.
FIRMWARE_LANGUAGE="${FIRMWARE_LANGUAGE:-LANGUAGE_EN_US}"

# What you say to start talking to him.
#
# This is a CUSTOM wake word, not one of Espressif's pre-trained WakeNet
# phrases -- so it can be his actual name. The firmware supports it directly
# (CONFIG_USE_CUSTOM_WAKE_WORD, main/audio/wake_words/custom_wake_word.cc),
# using esp-sr's MultiNet command recogniser instead of WakeNet.
#
# Plain English words, lower case, spaces between them. That works because
# MultiNet6's native input IS graphemes -- Espressif's docs: "MultiNet5
# requires the input command string to be phonemes, and MultiNet6 and
# MultiNet7 only accepts grapheme inputs to API calls." MultiNet7 would run
# grapheme-to-phoneme at runtime instead, which their docs say costs "a little
# accuracy drop", so 6 is the right one for a phrase given as text.
#
# "hi cue bee" rather than "hi cubie", and the respelling is the whole reason
# he answers at all.
#
# `cubie` is not an English word. MultiNet6 takes graphemes, but it resolves
# them through a fixed English lexicon -- so an invented name is a token it
# does not have, and no threshold, distance, volume or accent can make it
# match. It never did. The single "detection" ever seen on `hi cubie` came
# moments after his own speaker played the welcome sound, at prob 0.386, and
# was noise.
#
# `cue bee` is two ordinary words it certainly knows, pronounced identically.
# Same model, same threshold, one variable changed, and the first detection
# this device has ever produced from a person speaking to it:
#
#   CustomWakeWord: Custom wake word detected: command_id=1,
#                   string= HI HI CUE BEE, prob=0.400962
#   Application: Wake word detected: Cubie (state: 3)
#
# 23.7 seconds after boot, from idle, from across the desk. WAKE_WORD_DISPLAY
# is still "Cubie", so the respelling is invisible everywhere except here --
# he is still called by his name, he just hears it spelled the way it sounds.
#
# What was ruled out first, each by measurement rather than argument: the
# accent (six pronunciations), the sample rate (ReadAudioData asks for 16000
# and resamples), the enable gate (kDeviceStateIdle enables detection
# unconditionally), the channel de-interleave (Feed takes the even samples),
# the threshold (0.2 either way), the input level (nothing at 10 cm and a
# raised voice), and the microphone itself -- tools/audio-debug-listen.py
# measured real speech at -33.8 dBFS on channel 0, the slot the recogniser
# reads.
#
# "hi cue bee" rather than a bare "cue bee": a two-syllable name false-fires
# far more than a name with a carrier word in front of it, and MultiNet is a
# command recogniser rather than a purpose-trained wake model, so it needs the
# help. That argument got STRONGER with this spelling, not weaker -- `cue` and
# `bee` are common English sounds, so "can you be there at five" is a candidate
# in a way "cubie" never was. And the match above is tolerant enough to have
# accepted a doubled "HI", which is good for recall and bad for precision.
# Worth revisiting with a measured false-fire rate; not worth guessing at.
#
# Changing this changes the ASSETS, not the app -- see firmware/flash-assets.sh
# and the README. An OTA after changing it ships an app still listening for the
# old phrase, silently.
WAKE_WORD="${WAKE_WORD:-hi cue bee}"

# What the firmware calls him on screen and in the greeting it sends.
WAKE_WORD_DISPLAY="${WAKE_WORD_DISPLAY:-Cubie}"

# Confidence threshold, 1-99. LOWER IS MORE SENSITIVE -- the firmware's own
# help says so, which is the opposite of what the name suggests. 20 is its
# default. Raise it if he answers when nobody spoke to him; lower it if he
# ignores you.
WAKE_WORD_THRESHOLD="${WAKE_WORD_THRESHOLD:-20}"

# Which esp-sr command recogniser runs the wake word.
#
# The reasoning that first put MultiNet6 here was: "MultiNet5 requires the
# input command string to be phonemes, and MultiNet6 and MultiNet7 only accept
# grapheme inputs" -- so 6, since the phrase is written as words, and 7 costs
# "a little accuracy drop" running grapheme-to-phoneme at runtime.
#
# That argument holds for a phrase made of ENGLISH WORDS. It is the wrong test
# for an invented one. `cubie` is not a word: if 6 resolves graphemes through a
# fixed English lexicon while 7 derives pronunciation at runtime, then a made-up
# name is exactly the case where 6 cannot match and 7 must, and the "accuracy
# drop" is the price of the phrase being his name at all.
#
# So it is a variable now rather than a line in build.sh, because it is a thing
# to TEST rather than a thing to have decided. The measurement that made this
# the last candidate standing: the recogniser is fed 16 kHz mono at -33.8 dBFS
# on the correct channel -- measured with tools/audio-debug-listen.py -- and
# does not fire, at desk distance or at 10 cm, on the correct model with the
# correct threshold.
#
#   MULTINET_MODEL=CONFIG_SR_MN_EN_MULTINET7_QUANT bash ~/cubie/firmware/build.sh
#
# It names a Kconfig `choice` member exactly, and build.sh drops the losing
# sibling -- two selected members of one choice is an ill-defined build. The
# members are listed in esp-sr's Kconfig.projbuild; whether the pinned esp-sr
# carries the one you name is something only the build can tell you.
#
# IMPORTANT: changing this changes the ASSETS, not the app. The models and
# index.json live in generated_assets.bin, which OTA never writes -- see
# firmware/flash-assets.sh. An OTA after changing this ships an app whose
# wake word is still the old one, silently.
MULTINET_MODEL="${MULTINET_MODEL:-CONFIG_SR_MN_EN_MULTINET6_QUANT}"

# --- hearing what he hears ---------------------------------------------------
# Empty by default, and it should stay empty on a normal build.
#
# Set this to "host:port" and the image streams the RAW MICROPHONE over UDP to
# that address -- the exact buffer `ReadAudioData` returns, tapped on its last
# line, which is the same buffer `wake_word_->Feed(data)` is handed a moment
# later. Not a similar signal from a nearby point: the same samples the
# recogniser is asked to match.
#
# It exists because a wake word that does not fire has exactly one question at
# the bottom of it -- is there speech in that buffer -- and no amount of
# reading the firmware answers it. Four plausible readings of the source were
# each disproved by evidence before this was added; the fifth is not worth
# guessing at when it can be measured.
#
# Receive it with `tools/audio-debug-listen.py`, which reports RMS per channel
# and writes each channel as its own WAV. Channel 0 is the microphone slot the
# recogniser reads; channel 1 is the playback reference the echo canceller
# wants. Silence in both means the microphone is not capturing. Signal in 1
# but not 0 means the recogniser is reading the wrong slot.
#
#   AUDIO_DEBUG_UDP=office-server.local:8098 bash ~/cubie/firmware/build.sh
#
# Turn it off by building again with it unset -- build.sh REMOVES the two
# entries rather than merely not adding them, because sdkconfig_append is
# replaced by key and an option nobody re-states would otherwise persist
# silently into every future image. A debug tap is not a thing to leave on by
# accident: it puts a continuous copy of everything the microphone hears onto
# the LAN in clear.
AUDIO_DEBUG_UDP="${AUDIO_DEBUG_UDP:-}"

# --- toolchain ---------------------------------------------------------------
# Pinned to the IDF release the pinned upstream expects. Bumping this is a
# deliberate act with its own build to prove it.
IDF_IMAGE="${IDF_IMAGE:-espressif/idf:v5.5.2}"
BUILD_CPUS="${BUILD_CPUS:-4}"

# Where the working checkout lives. Not a temp dir: a full rebuild takes
# minutes and the incremental case is the common one.
WORK="${WORK:-$HOME/stackchan-mcp}"

# Where publish-cubie-firmware.sh drops the image the office serves. Must match
# AGENTHUB_CUBIE_FIRMWARE_DIR in the office's systemd environment.
PUBLISH_DIR="${PUBLISH_DIR:-$HOME/cubie-firmware}"
