# Build-time configuration for Cubie's firmware.
#
# Versioned on purpose. Everything here was, until now, either typed at a
# prompt or living in one machine's working tree -- which meant the font fix
# and the OTA endpoint were one `rm -rf ~/stackchan-mcp` from gone.
#
# Override any of it in the environment; these are defaults, not commandments.

# --- upstream sources, pinned ------------------------------------------------
# Both pins are exact commits, not branches. A build that floats on someone
# else's default branch is not reproducible, and "it worked last week" is not
# a bisectable claim.
STACKCHAN_REPO="${STACKCHAN_REPO:-https://github.com/kisaragi-mochi/stackchan-mcp.git}"
STACKCHAN_PIN="${STACKCHAN_PIN:-558cf404dcd215993d5af9a4495fd34339b6c314}"

# M5's avatar, vendored rather than submoduled -- see m5avatar/VENDORED.md for
# why. This pin must match the Commit row in that file.
M5_REPO="${M5_REPO:-https://github.com/m5stack/StackChan}"
M5_PIN="${M5_PIN:-1b5765599fba8aaad1811d9a79358ccc7051f5f3}"

# --- where the office lives, as the ROBOT sees it ----------------------------
# This address is baked into the image as CONFIG_OTA_URL, so a DHCP lease
# change silently breaks over-the-air updates on a device that is no longer
# plugged in to tell you. A static reservation for office-server is overdue;
# until then, changing this and rebuilding is the fix.
OFFICE_HOST="${OFFICE_HOST:-192.168.0.84}"
OFFICE_PORT="${OFFICE_PORT:-8420}"

# --- toolchain ---------------------------------------------------------------
# Pinned to the IDF release the pinned upstream expects. Bumping this is a
# deliberate act with its own build to prove it.
IDF_IMAGE="${IDF_IMAGE:-espressif/idf:v5.5.2}"
BUILD_CPUS="${BUILD_CPUS:-4}"

# Where the working checkout lives. Not a temp dir: a full rebuild takes
# minutes and the incremental case is the common one.
WORK="${WORK:-$HOME/stackchan-mcp}"

# Where publish-cubie-firmware.sh drops the image the office serves. Must match
# AGENTHUB_CUBIE_FIRMWARE_DIR in the office's systemd environment.
PUBLISH_DIR="${PUBLISH_DIR:-$HOME/cubie-firmware}"
