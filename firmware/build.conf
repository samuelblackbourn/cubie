# Build-time configuration for Cubie's firmware.
#
# Versioned on purpose. Everything here was, until now, either typed at a
# prompt or living in one machine's working tree -- which meant the font fix
# and the OTA endpoint were one `rm -rf ~/stackchan-mcp` from gone.
#
# Override any of it in the environment; these are defaults, not commandments.

# --- upstream sources, pinned ------------------------------------------------
# Both pins are exact commits, not branches. A build that floats on someone
# else's default branch is not reproducible, and "it worked last week" is not
# a bisectable claim.
STACKCHAN_REPO="${STACKCHAN_REPO:-https://github.com/kisaragi-mochi/stackchan-mcp.git}"
STACKCHAN_PIN="${STACKCHAN_PIN:-558cf404dcd215993d5af9a4495fd34339b6c314}"

# M5's avatar, vendored rather than submoduled -- see m5avatar/VENDORED.md for
# why. This pin must match the Commit row in that file.
M5_REPO="${M5_REPO:-https://github.com/m5stack/StackChan}"
M5_PIN="${M5_PIN:-1b5765599fba8aaad1811d9a79358ccc7051f5f3}"

# --- where the office lives, as the ROBOT sees it ----------------------------
# This address is baked into the image as CONFIG_OTA_URL, so a DHCP lease
# change silently breaks over-the-air updates on a device that is no longer
# plugged in to tell you. A static reservation for office-server is overdue;
# until then, changing this and rebuilding is the fix.
OFFICE_HOST="${OFFICE_HOST:-192.168.0.84}"
OFFICE_PORT="${OFFICE_PORT:-8420}"

# --- language ---------------------------------------------------------------
# The firmware defaults to LANGUAGE_ZH_CN, so every on-screen string and every
# locale sound asset (welcome, activation, wificonfig, the spoken digits) is
# Chinese. That is what makes the boot screen unreadable and the startup voice
# unintelligible.
#
# This selects a Kconfig `choice`, so it must name the option exactly:
# LANGUAGE_EN_US, LANGUAGE_JA_JP, LANGUAGE_DE_DE and so on -- see
# firmware/main/Kconfig.projbuild for the full list.
FIRMWARE_LANGUAGE="${FIRMWARE_LANGUAGE:-LANGUAGE_EN_US}"

# What you say to start talking to him.
#
# This is a CUSTOM wake word, not one of Espressif's pre-trained WakeNet
# phrases -- so it can be his actual name. The firmware supports it directly
# (CONFIG_USE_CUSTOM_WAKE_WORD, main/audio/wake_words/custom_wake_word.cc),
# using esp-sr's MultiNet command recogniser instead of WakeNet.
#
# Plain English words, lower case, spaces between them. That works because
# MultiNet6's native input IS graphemes -- Espressif's docs: "MultiNet5
# requires the input command string to be phonemes, and MultiNet6 and
# MultiNet7 only accepts grapheme inputs to API calls." MultiNet7 would run
# grapheme-to-phoneme at runtime instead, which their docs say costs "a little
# accuracy drop", so 6 is the right one for a phrase given as text.
#
# "hi cubie" rather than "cubie": a bare two-syllable name false-fires far more
# than a name with a carrier word in front of it, and MultiNet is a command
# recogniser rather than a purpose-trained wake model, so it needs the help.
WAKE_WORD="${WAKE_WORD:-hi cubie}"

# What the firmware calls him on screen and in the greeting it sends.
WAKE_WORD_DISPLAY="${WAKE_WORD_DISPLAY:-Cubie}"

# Confidence threshold, 1-99. LOWER IS MORE SENSITIVE -- the firmware's own
# help says so, which is the opposite of what the name suggests. 20 is its
# default. Raise it if he answers when nobody spoke to him; lower it if he
# ignores you.
WAKE_WORD_THRESHOLD="${WAKE_WORD_THRESHOLD:-20}"

# --- toolchain ---------------------------------------------------------------
# Pinned to the IDF release the pinned upstream expects. Bumping this is a
# deliberate act with its own build to prove it.
IDF_IMAGE="${IDF_IMAGE:-espressif/idf:v5.5.2}"
BUILD_CPUS="${BUILD_CPUS:-4}"

# Where the working checkout lives. Not a temp dir: a full rebuild takes
# minutes and the incremental case is the common one.
WORK="${WORK:-$HOME/stackchan-mcp}"

# Where publish-cubie-firmware.sh drops the image the office serves. Must match
# AGENTHUB_CUBIE_FIRMWARE_DIR in the office's systemd environment.
PUBLISH_DIR="${PUBLISH_DIR:-$HOME/cubie-firmware}"
